services:
    nginx: 
        image: nginx:latest
        volumes: 
            - ./:/var/www
            - ./_docker/nginx/conf.d:/etc/nginx/conf.d
        ports:
            - "8080:80"
        depends_on:
            - app
        container_name: app_nginx
    app:
        build:
            context: .
            dockerfile: _docker/app/Dockerfile
        volumes:
            - ./:/var/www
        depends_on:
            - db
        container_name: gmcosmo_app
    db:
        image: mysql:8.4
        restart: always
        volumes:
            - ./tmp/db:/var/lib/mysql
        environment:
            MYSQL_DATABASE: gm_cosmo
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8101:3304"
        command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
        container_name: gmcosmo_db